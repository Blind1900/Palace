<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#111110">
    <meta name="description" content="Art, comics, and animations from Palace of Dionysus.">
    <link rel="stylesheet" href="./palace.css">
    <title>Palace of Dionysus · 酒神的宮殿</title>
  </head>
  <body>
    <div class="site-shell">
      <header class="site-header">
        <a class="wordmark" href="#home" aria-label="Palace of Dionysus home">
          <span class="wordmark-name">Palace of Dionysus</span>
          <span class="wordmark-translation" lang="zh">酒神的宮殿</span>
        </a>
        <form class="art-search" role="search" autocomplete="off">
          <label class="visually-hidden" for="art-search-input">Search artwork / 搜尋作品</label>
          <span class="search-prefix" aria-hidden="true">/</span>
          <input
            id="art-search-input"
            type="search"
            placeholder="Search artwork / 搜尋作品"
            aria-controls="art-search-results"
            aria-expanded="false"
          >
          <div class="search-results" id="art-search-results" hidden></div>
        </form>
        <a class="contact-link" href="#contact">Contact / 聯絡</a>
      </header>

      <main>
        <section class="feature-wrap" aria-label="Featured work">
          <div class="feature-banner" id="feature-banner" role="group" aria-label="Featured artwork">
            <a class="feature-art-link" id="feature-link" href="#art" aria-label="View featured work"></a>
            <button class="feature-arrow feature-prev" id="feature-prev" type="button" aria-label="Previous featured artwork">&lt;</button>
            <button class="feature-arrow feature-next" id="feature-next" type="button" aria-label="Next featured artwork">&gt;</button>
          </div>
        </section>

        <nav class="site-nav" id="site-nav" aria-label="Main navigation"></nav>

        <div id="page-content" tabindex="-1">
          <section class="loading-state" aria-live="polite">
            <p class="eyebrow">Welcome in</p>
            <h2>The collection is getting ready.</h2>
          </section>
        </div>
      </main>

      <footer class="site-footer">
        <a class="footer-wordmark" href="#home">[ Palace of Dionysus ]</a>
        <span lang="zh">藝術 · 漫畫 · 動畫</span>
        <a href="#contact">Contact / 聯絡</a>
      </footer>
    </div>
    <script src="./palace.js"></script>
  </body>
</html>
