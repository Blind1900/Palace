      <div class="pillar-compass">
        <span class="compass-reading" id="compass-reading">000°</span>
      </div>
    </div>
    <div class="site-shell">
      <header class="site-header">
        <a class="wordmark" href="#featured" aria-label="Palace of Dionysus home">
          <span class="wordmark-name">Palace of Dionysus</span>
          <span class="wordmark-separator" aria-hidden="true">·</span>
          <span class="wordmark-translation" lang="zh">酒神的宮殿</span>
        </a>
        <form class="art-search" role="search" autocomplete="off">
          <label class="visually-hidden" for="art-search-input">Search artwork / 搜尋作品</label>
          <span class="search-prefix" aria-hidden="true">/</span>
          <input
            id="art-search-input"
            type="search"
            placeholder="Search artwork / 搜尋作品"
            aria-controls="art-search-results"
            aria-expanded="false"
          >
          <div class="search-results" id="art-search-results" hidden></div>
          <span class="ascii-frame" aria-hidden="true"></span>
        </form>
      </header>

      <main>
        <section class="feature-wrap" aria-label="Featured work">
          <div class="feature-banner" id="feature-banner" role="group" aria-label="Featured artwork">
            <img class="feature-image" id="feature-image" src="./pfpalpha.png" alt="" fetchpriority="high" decoding="async">
            <a class="feature-art-link" id="feature-link" href="#art" aria-label="View featured work"></a>
            <button class="feature-arrow feature-prev" id="feature-prev" type="button" aria-label="Previous featured artwork">
              <span class="arrow-symbol" aria-hidden="true">&lt;</span>
              <span class="ascii-frame" aria-hidden="true"></span>
            </button>
            <button class="feature-arrow feature-next" id="feature-next" type="button" aria-label="Next featured artwork">
              <span class="arrow-symbol" aria-hidden="true">&gt;</span>
              <span class="ascii-frame" aria-hidden="true"></span>
            </button>
            <span class="ascii-frame" aria-hidden="true"></span>
          </div>
        </section>

        <nav class="site-nav" id="site-nav" aria-label="Main navigation"></nav>

        <div id="page-content" tabindex="-1">
          <section class="loading-state" aria-live="polite">
            <p class="eyebrow">Welcome in</p>
            <h2>The collection is getting ready.</h2>
          </section>
        </div>
      </main>

      <footer class="site-footer">
        <a class="footer-wordmark" href="#featured">[ Palace of Dionysus ]</a>
        <span>藝術 Art · 漫畫 Comics · 動畫 Animation</span>
      </footer>
    </div>
    <script src="./palace.js"></script>
