<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Urban Defence</title>
    <!-- The game (N8): the pixel world, opened on the match menu. Runs from the files as they are -
         no server, nothing to install: open this page in Chrome or Edge. The old beta is
         beta-legacy.html; the dev page with the sandbox tools is pixel-world.html. -->
    <style>
      html, body { margin: 0; height: 100%; background: #05080a; color: #9fc28a; overflow: hidden; }
      #world-canvas { display: block; width: 100vw; height: 100vh; image-rendering: pixelated; cursor: crosshair; }
      #world-status { position: fixed; left: 8px; bottom: 6px; font: 12px Consolas, monospace; pointer-events: none;
        background: #05080acc; padding: 2px 6px; }
      /* the selected unit's panel - its name, its state, its control keys (N78) */
      #unit-panel { position: fixed; right: 8px; top: 8px; width: 216px; font: 12px Consolas, monospace;
        background: #05080acc; border: 1px solid #2c4030; color: #9fc28a; padding: 8px; display: none; }
      #unit-panel.on { display: block; }
      #unit-panel h3 { margin: 0 0 6px; font: 13px Consolas, monospace; color: #e4f0c8; letter-spacing: 1px; }
      #unit-panel .bar { height: 8px; background: #0b140f; border: 1px solid #2c4030; margin: 3px 0 8px; }
      #unit-panel .bar i { display: block; height: 100%; background: #6fae58; }
      #unit-panel .bar i.hurt { background: #b8923e; }
      #unit-panel .bar i.grave { background: #a4502e; }
      #unit-panel .keys div { display: flex; gap: 6px; margin: 2px 0; align-items: baseline; }
      #unit-panel kbd { background: #0b140f; border: 1px solid #2c4030; padding: 0 5px; color: #e4f0c8; min-width: 14px; text-align: center; flex: none; }
      #unit-panel .items { display: flex; gap: 4px; margin-top: 6px; }
      #unit-panel .slot { width: 44px; height: 44px; border: 1px solid #2c4030; background: #0b140f;
        display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 10px; }
      #unit-panel .slot b { color: #e4f0c8; font-size: 11px; }
      @font-face { font-family: 'Ithaca'; src: url('assets/Ithaca-LVB75.ttf') format('truetype'); }
      #cursor-note { position: fixed; pointer-events: none; display: none; font: 16px 'Ithaca', Consolas, monospace;
        color: #e8f0d8; background: #0a120ee8; border: 2px solid #3c5a40; padding: 3px 7px 2px; white-space: nowrap;
        box-shadow: 2px 2px 0 #000; image-rendering: pixelated; }
      #cursor-note.good { border-color: #c8b040; color: #fff0b8; }
      #cursor-note.bad { border-color: #b04030; color: #ffc8b8; }
      noscript { display: block; padding: 40px; font: 18px Consolas, monospace; }
    </style>
  </head>
